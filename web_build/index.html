<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vassnian — Isekai RPG</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f0a14;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            outline: none;
            cursor: default;
        }
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #dac8ab;
            font-family: serif;
            font-size: 24px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="loading">Loading Vassnian...</div>
    <canvas id="glcanvas" tabindex="1"></canvas>
    <script>
        // Hide loading message once WASM starts
        var Module = {
            canvas: document.getElementById("glcanvas"),
            onRuntimeInitialized: function() {
                document.getElementById("loading").style.display = "none";
            }
        };
    </script>
    <!-- Macroquad WASM JS glue (generated by miniquad) -->
    <script src="https://not-fl3.github.io/miniquad-samples/mq_js_bundle.js"></script>
    <script>
        load("vassnian_game.wasm");
    </script>
</body>
</html>
